name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check app.js
      - run: node --check controllers/connected-account-controller.js
      - run: node --check controllers/learning-sheet-controller.js
      - run: node --check controllers/resource-hub-controller.js
      - run: node --check controllers/resume-controller.js
      - run: node --check controllers/storage-controller.js
      - run: node --check controllers/semester-controller.js